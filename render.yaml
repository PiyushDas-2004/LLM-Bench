# Render Blueprint: deploys the LLMBench REST API on Render's free plan ($0).
# Free web services spin down after 15 minutes without traffic (about a minute to wake)
# and have an ephemeral filesystem, so the SQLite run store resets on restart.
# The API key is generated by Render; find it under the service's Environment tab.
services:
  - type: web
    name: llmbench-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLMBENCH_API_KEY
        generateValue: true
      - key: LLMBENCH_DB_URL
        value: sqlite:////tmp/llmbench.db
      - key: LLMBENCH_LOG_FORMAT
        value: json
