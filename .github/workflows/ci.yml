name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python }} --locked
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy src
      - name: Tests with coverage gate (>= 85%)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --locked
      - name: bandit
        run: uv run bandit -q -r src -c pyproject.toml
      - name: pip-audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-extras > requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict

  dashboard:
    name: web dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  build:
    name: sdist, wheel and Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/llmbench --version
          cd "$(mktemp -d)" && /tmp/wheel-venv/bin/llmbench init demo && cd demo && /tmp/wheel-venv/bin/llmbench run experiment.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build Docker image
        run: docker build -t llmbench:ci .
      - name: Benchmark inside the container
        run: docker run --rm llmbench:ci run examples/quickstart.yaml --yes
      - name: API starts with the image defaults (as on Render, PORT=10000)
        run: |
          docker run -d --name api -p 10000:10000 -e PORT=10000 -e LLMBENCH_API_KEY=ci-only-key llmbench:ci
          for i in $(seq 1 30); do curl -sf localhost:10000/health && break; sleep 1; done
          curl -sf localhost:10000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:10000/runs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-only-key' localhost:10000/runs)" = 200
          docker rm -f api
