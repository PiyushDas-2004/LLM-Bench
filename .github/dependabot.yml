version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "bandit", "pip-audit", "pre-commit", "types-*", "respx"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
