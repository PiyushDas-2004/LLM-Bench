name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Include the command you ran and the full output.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What did you expect?}
    validations: {required: true}
  - type: textarea
    id: config
    attributes: {label: Experiment config (remove secrets), render: yaml}
  - type: input
    id: version
    attributes: {label: llmbench --version / Python version / OS}
    validations: {required: true}
