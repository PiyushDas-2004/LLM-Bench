name: Feature request
description: Suggest a metric, provider, report or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to measure or automate?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
